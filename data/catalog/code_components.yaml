    root: "runtime"
    validation_status: "static_review_only"
  -
    module: "vm_bench"
    path: "vm_bench/"
    decision: "defer"
    reason: "单体旧版与模块化新版并行；需先确定 replay 策略。"
    root: "runtime"
    validation_status: "static_review_only"
  -
    module: "llm_replay"
    path: "llm_replay/"
