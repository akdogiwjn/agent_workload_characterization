    module: "bench_core"
    path: "src/bench_core/"
    decision: "defer"
    reason: "需 P0-00 runtime 单独深度审计接口（bench.py/schemas.py/stats_collector.py/task_runner/）；不假定可与新监测链路无缝连接。"
