[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workload-characterization"
version = "0.1.0"
description = "CPU/OS-oriented Agent workload characterization tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13,<3", "PyYAML>=6.0,<7"]

[project.scripts]
awc = "agent_workload_characterization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_workload_characterization*"]
namespaces = false
