  <g id="text_16">
   <text style="font-weight: 700; font-size: 28px; font-family: 'DejaVu Sans', 'Droid Sans Fallback'; text-anchor: start; fill: #152238" x="74.88" y="48.6" transform="rotate(-0 74.88 48.6)">一个会话内，保存的API请求会重叠多少？</text>
  </g>
  <g id="text_17">
   <text style="font-size: 16px; font-family: 'DejaVu Sans', 'Droid Sans Fallback'; text-anchor: start; fill: #64748b" x="74.88" y="87.48" transform="rotate(-0 74.88 87.48)">对每个会话独立扫描[t, t+api_time)区间；统计峰值，再跨393会话画累计分布</text>
  </g>
  <g id="text_18">
   <text style="font-size: 12px; font-family: 'DejaVu Sans', 'Droid Sans Fallback'; fill: #64748b" transform="translate(74.88 586.667109)">主/子代理时间采用已发布语料的根会话相对坐标；不叠加父起点，不混合不同会话的时钟。</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans', 'Droid Sans Fallback'; fill: #64748b" transform="translate(74.88 601.796016)">请求区间重叠不是CPU/GPU并发、实际线程数或子代理数量，也不证明父代理在等待。</text>
  </g>
