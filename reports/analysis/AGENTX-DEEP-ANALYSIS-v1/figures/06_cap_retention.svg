  <g id="text_19">
   <text style="font-weight: 700; font-size: 28px; font-family: 'DejaVu Sans', 'Droid Sans Fallback'; text-anchor: start; fill: #152238" x="74.88" y="48.6" transform="rotate(-0 74.88 48.6)">256k筛选保留了多少请求与输入量？</text>
  </g>
  <g id="text_20">
   <text style="font-size: 16px; font-family: 'DejaVu Sans', 'Droid Sans Fallback'; text-anchor: start; fill: #64748b" x="74.88" y="87.48" transform="rotate(-0 74.88 87.48)">以Full为分母，保留条件为重建输入+输出≤256,000；两版不是独立实验组</text>
  </g>
  <g id="text_21">
   <text style="font-size: 12px; font-family: 'DejaVu Sans', 'Droid Sans Fallback'; fill: #64748b" transform="translate(74.88 586.667109)">“输入量”是逐请求重建输入之和，重复前缀会重复累计；不是唯一语料量、计费量或实测计算工作量。</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans', 'Droid Sans Fallback'; fill: #64748b" transform="translate(74.88 601.796016)">筛选会改变保留请求的相邻关系；这里不将版本差异解释为性能收益。</text>
  </g>
