   <text style="font-size: 16px; font-family: 'DejaVu Sans', 'Droid Sans Fallback'; text-anchor: start; fill: #64748b" x="74.88" y="87.48" transform="rotate(-0 74.88 87.48)">原始输出长度仅作为 max_tokens 上限，允许模型自然 stop；输入为固定合成文本</text>
