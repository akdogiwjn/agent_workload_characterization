  </g>
  <g id="text_35">
   <text style="font-size: 12px; font-family: 'DejaVu Sans', 'Droid Sans Fallback'; fill: #64748b" transform="translate(74.88 586.713984)">3个固定会话、71条正式请求；另计2条历史/新增探针；每类只有一次实测。</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans', 'Droid Sans Fallback'; fill: #64748b" transform="translate(74.88 601.796016)">非思考远程DeepSeek；保留官方SPAWN/JOIN结构，移除原始等待；不同输入/输出量，不作因果加速比较。</text>
  </g>
