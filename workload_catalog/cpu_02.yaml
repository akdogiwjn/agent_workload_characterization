perf:
  binary: /usr/bin/perf
  record:
    # perf-record(1): -p records an existing process id (attach); default
    # inheritance covers the exec'd eval script and its descendants.
    argv_format: ['perf', 'record', '-F', '99', '-e', 'cycles', '-p', '<host_target_pid>', '-o', '<perf_data>']
    event: cycles
    frequency_hz: 99
    mode: host_attach_to_container_target
    callgraph: disabled_this_batch
  readiness:
    # perf-record(1) documents --control=fifo:ctl-fifo[,ack-fifo]: enable/
    # disable/stop commands on the ctl fifo, each acknowledged with "ack\n"
    # on the ack fifo; -D -1 starts the measurement with events DISABLED.
    # Barrier = real protocol ACK ('enable' -> 'ack'), never Popen success,
    # a sleep, or perf.data growth (which may be metadata). Sampling window
    # = [enable ack, disable ack]; eval window = [release, exec exit].
    protocol: perf_record_control_fifo_ack
    start_disabled: '-D -1'
    ack_timeout_s: 5
    barrier: enable_ack_before_release_and_disable_ack_after_eval
  report:
    argv_format: ['perf', 'report', '--stdio', '--no-children', '-i', '<perf_data>']
    symfs_argv_format: ['perf', 'report', '--stdio', '--no-children', '--symfs', '<symbols_dir>', '-i', '<perf_data>']
sampling:
  interval_s: 0.2
  boundary: release_before_eval_through_eval_exit_container_scope
  formal_io: null_with_reason
measurement:
  mapping: innermost_NSpid_plus_pidns_inode_plus_starttime_unique_match_against_container_init
  target_scope: container eval supervisor and its exec chain; host PID and container scope recorded separately
  cpu_boundary_semantics: shared cgroup scope evidence, not per-function CPU seconds
limits:
  batch_wall_s: 300
  cleanup_reserve_s: 30
  prepare_wall_s: 60
  eval_wall_s: 120
  operation_s: 15
  perf_ready_window_s: 10
  record_frequency_hz_max: 99
  report_threshold_mib: 100
  container_cpu: 4
  container_memory: 8GiB
  network: none
  pull: never
  retries: 0
